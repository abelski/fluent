<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Fluent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;800&display=swap" rel="stylesheet">
<style>
  /* Tokens below are literal copies of extension/theme.js's FLUENT_THEME — a
     <style> block can't reference the JS constants directly, so the values
     are kept identical by hand; theme.js remains the single source of truth
     used everywhere colors are set from script. Palette + 0px radius pixel-
     match `temp_files/redesign extention/Fluent Extension.dc.html` (Plan #35). */
  @keyframes tak-float { 0%, 100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-5px) rotate(-2deg); } }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    width: 340px;
    font-family: 'Archivo', system-ui, sans-serif;
    font-weight: 400;
    background: #f3f2f2; /* bg */
    color: #201e1d; /* text */
  }
  #app { padding: 16px; } /* space-4 */
  .env {
    font-size: 11px;
    color: color-mix(in srgb, #201e1d 55%, transparent); /* text-muted */
    margin-bottom: 8px;
  }
  .card {
    background: #fff;
    border: 2px solid #201e1d; /* text */
  }
  .card-header {
    display: flex;
    align-items: center;
    gap: 12px; /* space-3 */
    padding: 12px 16px; /* space-3 space-4 */
    border-bottom: 2px solid #201e1d; /* text */
  }
  .card-header .brand {
    font-weight: 800;
    font-size: 16px;
  }
  .tag-outline {
    margin-left: auto;
    display: inline-flex;
    align-items: center;
    font-size: 11px;
    letter-spacing: 0.02em;
    padding: 3px 10px;
    border: 1px solid #ec3013; /* accent */
    color: #ec3013; /* accent */
  }
  .stat-block {
    padding: 16px; /* space-4 */
    border-bottom: 2px solid rgba(32, 30, 29, 0.4); /* divider */
  }
  .stat-row { display: flex; align-items: baseline; gap: 8px; /* space-2 */ }
  .stat-total { font-weight: 800; font-size: 34px; line-height: 1; }
  .stat-label { font-size: 13px; color: color-mix(in srgb, #201e1d 55%, transparent); }
  .progress-track { height: 6px; background: #d7d3d3; /* neutral300 */ margin-top: 12px; /* space-3 */ }
  .progress-fill { height: 100%; background: #ec3013; /* accent */ }
  .stat-next { font-size: 12px; color: color-mix(in srgb, #201e1d 55%, transparent); margin-top: 4px; /* space-1 */ }
  .two-col {
    display: grid;
    grid-template-columns: 1fr 1fr;
    border-bottom: 2px solid rgba(32, 30, 29, 0.4); /* divider */
  }
  .two-col > div { padding: 16px; /* space-4 */ }
  .two-col > div:first-child { border-right: 2px solid rgba(32, 30, 29, 0.4); /* divider */ }
  .cell-value { font-weight: 800; font-size: 20px; }
  .cell-value.accent { color: #ae1800; /* accentActive */ }
  .cell-label { font-size: 12px; color: color-mix(in srgb, #201e1d 55%, transparent); }
  .buttons { padding: 16px; /* space-4 */ display: grid; gap: 8px; /* space-2 */ }
  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    width: 100%;
    font-family: inherit;
    font-weight: 800;
    font-size: 13px;
    padding: 9px 12px;
    border: 1px solid transparent;
    cursor: pointer;
  }
  .btn-primary { background: #ec3013; color: #f3f2f2; } /* accent / bg */
  .btn-primary:hover { background: #dd2b0f; } /* accentHover */
  .btn-primary:active { background: #ae1800; } /* accentActive */
  .btn-secondary { background: #fff; color: #201e1d; border-color: rgba(32, 30, 29, 0.4); } /* divider */
  .btn-secondary:hover { background: color-mix(in srgb, #201e1d 7%, transparent); }
  .btn-ghost { background: none; color: #ec3013; justify-content: flex-start; padding-inline: 0; } /* accent */
  .btn-ghost:hover { text-decoration: underline; }
  .btn:disabled { opacity: 0.5; cursor: default; }
  .footer-links {
    margin-top: 12px;
    display: flex;
    justify-content: space-between;
    gap: 12px;
  }
  .footer-links a {
    font-size: 11px;
    color: color-mix(in srgb, #201e1d 55%, transparent); /* text-muted */
    text-decoration: none;
    cursor: pointer;
    background: none;
    border: none;
    font-family: inherit;
    padding: 0;
  }
  .footer-links a:hover { text-decoration: underline; }
</style>
</head>
<body>
  <div id="app">
    <div>Loading…</div>
  </div>
  <script src="theme.js"></script>
  <script src="popup.js"></script>
</body>
</html>
