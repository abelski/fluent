<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Fluent</title>
<style>
  body {
    margin: 0;
    width: 260px;
    font-family: system-ui, -apple-system, sans-serif;
    background: #ffffff;
    color: #111827;
  }
  #app { padding: 16px; }
  .brand {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 700;
    font-size: 15px;
    margin-bottom: 12px;
  }
  .brand .dot { color: #10b981; }
  .env {
    display: inline-block;
    font-size: 11px;
    color: #6b7280;
    background: #f3f4f6;
    border-radius: 999px;
    padding: 2px 8px;
    margin-bottom: 10px;
  }
  .email {
    font-size: 13px;
    color: #374151;
    margin-bottom: 6px;
    word-break: break-all;
  }
  .badge {
    display: inline-block;
    font-size: 11px;
    font-weight: 600;
    border-radius: 999px;
    padding: 2px 8px;
    margin-bottom: 12px;
  }
  .badge.premium { background: #FFB81C; color: #111827; }
  .badge.free { background: #f3f4f6; color: #6b7280; }
  button {
    display: block;
    width: 100%;
    padding: 9px 10px;
    margin-top: 8px;
    border: none;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
  }
  button.primary { background: #006A44; color: #fff; }
  button.secondary { background: #f3f4f6; color: #374151; }
  button:disabled { opacity: 0.6; cursor: default; }
  .options-link {
    display: block;
    margin-top: 14px;
    font-size: 12px;
    color: #6b7280;
    text-align: center;
    text-decoration: none;
  }
  .options-link:hover { text-decoration: underline; }
</style>
</head>
<body>
  <div id="app">
    <div class="brand"><span>f</span><span class="dot">.</span><span>Fluent</span></div>
    <div>Loading…</div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
